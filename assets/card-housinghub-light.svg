<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="HousingHub: student housing marketplace with live messaging"><title>HousingHub: student housing marketplace with live messaging</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.pulse{stroke-dasharray:8 120;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:128}to{stroke-dashoffset:0}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.breathe{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{opacity:.3}}.bb{opacity:0;animation:bb 8s infinite}@keyframes bb{0%{opacity:0;transform:translateY(4px)}5%,85%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}.dt{animation:dt 1s ease-in-out infinite}@keyframes dt{50%{transform:translateY(-3px)}}</style><rect x=".5" y=".5" width="479" height="269" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="1" y="18" width="3" height="234" rx="1.5" fill="#0a7f78"/><text x="20.0" y="29.0" font-size="11" fill="#0a7f78" text-anchor="start" font-weight="700" letter-spacing="1">L4 PRODUCT</text><text x="107.0" y="29.0" font-size="11" fill="#59636e" text-anchor="start" >· HousingHub</text><rect x="375" y="15" width="85" height="19" rx="9.5" fill="none" stroke="#0a7f78"/><text x="417.5" y="28.5" font-size="11" fill="#0a7f78" text-anchor="middle" >full stack</text><line x1="20" y1="44" x2="460" y2="44" stroke="#d0d7de" stroke-dasharray="2 4"/><g transform="translate(20,54)"><rect x="0" y="2" width="168" height="114" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><rect x="8" y="10" width="152" height="52" rx="5" fill="#0a7f78" fill-opacity=".12"/><path d="M68 38 L84 24 L100 38" fill="none" stroke="#0a7f78" stroke-width="2" stroke-linejoin="round"/><rect x="72" y="37" width="24" height="17" fill="none" stroke="#0a7f78" stroke-width="2"/><rect x="81" y="44" width="6" height="10" fill="#0a7f78"/><text x="10.0" y="79.0"